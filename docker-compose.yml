services:
  app:
    build: .
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://flagboard:flagboard@postgres:5432/flagboard
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: flagboard
      POSTGRES_PASSWORD: flagboard
      POSTGRES_DB: flagboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: